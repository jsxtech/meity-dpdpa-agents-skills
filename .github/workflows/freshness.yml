name: DPDP Suite CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check DPDP Rules version
        run: |
          DRAFT_COUNT=$(grep -r 'dpdp_rules_version.*draft' agents/ skills/ | wc -l)
          echo "Files referencing draft rules: $DRAFT_COUNT"
          if [ "$DRAFT_COUNT" -gt 0 ]; then
            echo '::warning::DPDP Rules still marked as draft in '"$DRAFT_COUNT"' files. Check https://meity.gov.in'
          fi

      - name: Check last_updated dates
        run: |
          STALE_BEFORE=$(date -d '6 months ago' +%Y-%m)
          echo "Flagging files with last_updated before $STALE_BEFORE"
          STALE=0
          for f in agents/*.md skills/*.md; do
            FILE_DATE=$(grep -oP 'last_updated:\s*"\K[0-9]{4}-[0-9]{2}' "$f" || true)
            if [ -n "$FILE_DATE" ] && [[ "$FILE_DATE" < "$STALE_BEFORE" ]]; then
              echo "STALE: $f (last_updated: $FILE_DATE)"
              STALE=$((STALE + 1))
            fi
          done
          echo "Stale files: $STALE"

      - name: Validate internal links
        run: |
          EXIT=0
          for f in $(find . -name '*.md' -not -path './.git/*'); do
            grep -oP '\[.*?\]\(\K[^)#]+' "$f" 2>/dev/null | while read -r link; do
              [[ "$link" =~ ^https?:// ]] && continue
              [[ "$link" =~ ^mailto: ]] && continue
              TARGET="$(dirname "$f")/$link"
              if [ ! -f "$TARGET" ]; then
                echo "::error file=$f::Broken link: $link"
                EXIT=1
              fi
            done
          done
          exit $EXIT

      - name: Validate counts match README
        run: |
          AGENT_COUNT=$(ls agents/dpdp-*.md agents/meity-*.md 2>/dev/null | wc -l)
          SKILL_COUNT=$(ls skills/dpdp-*.md skills/meity-*.md 2>/dev/null | wc -l)
          echo "Agents: $AGENT_COUNT (expected 17)"
          echo "Skills: $SKILL_COUNT (expected 17)"
          [ "$AGENT_COUNT" -eq 17 ] || { echo "::error::Agent count mismatch"; exit 1; }
          [ "$SKILL_COUNT" -eq 17 ] || { echo "::error::Skill count mismatch"; exit 1; }

      - name: Validate manifest file paths
        run: |
          EXIT=0
          grep -oP 'file:\s*\K\S+' manifest.yaml | while read -r path; do
            if [ ! -f "$path" ]; then
              echo "::error::manifest.yaml references missing file: $path"
              EXIT=1
            fi
          done
          exit $EXIT

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - name: Build mkdocs site
        run: mkdocs build --strict

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cspell
        run: npm install -g cspell@8
      - name: Run spell check
        run: cspell "**/*.md" --config .cspell.json --no-progress

  link-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          curl -sLO https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          chmod +x lychee
      - name: Check external links
        run: |
          ./lychee --no-progress --exclude-mail --accept '200..=399' \
            --exclude 'dpbi.gov.in' --exclude 'egazette.gov.in' --exclude 'tdsat.gov.in' \
            --timeout 30 --retry-wait-time 5 --max-retries 2 \
            '**/*.md' || true

  create-issue:
    if: github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'freshness-check',
              state: 'open'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Monthly DPDP Suite Freshness Check',
                body: 'Monthly reminder to check:\n- Have DPDP Rules been gazetted?\n- Any new DPBI orders or MeITY notifications?\n- Any sector-specific regulatory updates (RBI/SEBI/IRDAI)?\n\nSee RULES_TRACKER.md for provisions to check.',
                labels: ['freshness-check']
              });
            }
